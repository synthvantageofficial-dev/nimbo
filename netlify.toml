# Nimbo — Netlify config
# Daily autopilot: Nimbo generates fresh briefs for opted-in creators on its own.
[functions."daily"]
  schedule = "@daily"

# Queue safety net: drains any request the instant background worker missed.
# Every 5 minutes keeps invocation usage low (~8.6k/month) while nothing gets stuck.
[functions."worker-scheduled"]
  schedule = "*/5 * * * *"
